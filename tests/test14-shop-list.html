<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>山货铺 · 今日到货</title>
<style>
/* 小程序：750rpx 基准。本页按 375 逻辑宽写成 px，注释给 rpx 换算（1px = 2rpx） */
:root{
  --bg:#F4F6F4; --surface:#FFFFFF; --surface-2:#EDF1EE;
  --ink:#1A1D1A; --ink-2:#3E463F; --muted:#5C665F;
  --line:rgba(26,29,26,.10);
  --brand:#0F3D2A; --brand-hi:#17573C; --brand-ink:#FFFFFF;
  --price:#A33B2A; --tag-bg:rgba(15,61,42,.08); --tag-ink:#154A33;
  --r-1:6px; --r-2:12px; --r-3:18px;
  --shadow-1:0 1px 2px rgba(26,29,26,.05),0 1px 3px rgba(26,29,26,.05);
  --shadow-2:0 4px 12px -2px rgba(26,29,26,.08),0 12px 24px -10px rgba(26,29,26,.10);
  --fs-cap:12px; --fs-body:14px; --fs-title:16px; --fs-price:20px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:var(--fs-body);line-height:1.55;font-variant-numeric:tabular-nums;
  max-width:430px;margin:0 auto;min-height:100dvh;overflow-x:clip}

/* ===== 导航：胶囊避让（右侧预留 48px = 96rpx） ===== */
.nav{position:sticky;top:0;z-index:30;background:var(--brand);color:var(--brand-ink);
  padding-top:calc(8px + env(safe-area-inset-top))}
.nav-bar{display:flex;align-items:center;height:44px;padding:0 48px 0 16px}
.nav-title{font-size:17px;font-weight:600;letter-spacing:-.01em}
.nav-sub{margin-left:auto;font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.nav-tabs{display:flex;gap:20px;padding:0 16px 10px;font-size:13px;opacity:.82}
.nav-tabs span{position:relative;padding-bottom:4px}
.nav-tabs .on{opacity:1;font-weight:600}
.nav-tabs .on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#fff;border-radius:2px}

/* ===== 搜索 ===== */
/* 只有一个固定层：搜索 + 筛选合并进 .filters，避免相互遮挡 */
.filters{position:sticky;top:calc(env(safe-area-inset-top) + 82px);z-index:20;
  background:var(--bg);padding-top:10px;border-bottom:1px solid rgba(26,29,26,.06)}
.search{padding:0 16px 8px}
.search-in{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px}
.search-in svg{flex:none;color:var(--muted)}
.search-in input{flex:1;border:none;outline:none;background:none;font-size:16px;color:var(--ink)}
.search-in input::placeholder{color:var(--muted)}
.search-in input:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:4px}

/* ===== 筛选 chips（选中 150ms） ===== */
.chips{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:13px;
  transition:background 150ms var(--ease),color 150ms var(--ease),border-color 150ms var(--ease),transform 100ms}
.chip.on{background:var(--tag-bg);color:var(--tag-ink);border-color:rgba(15,61,42,.28);font-weight:600}
.chip:active{transform:scale(.97)}
.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ===== 瀑布流：首卡破格（整宽 + 等高线签名） ===== */
.list{padding:2px 16px calc(88px + env(safe-area-inset-bottom))}
.hero-card{position:relative;border-radius:var(--r-3);overflow:hidden;background:var(--surface);
  box-shadow:var(--shadow-2);margin-bottom:12px;display:block;
  color:inherit;text-decoration:none} /* 链接默认的蓝色下划线会污染卡片标题 */
.hero-img{position:relative;aspect-ratio:16/9;overflow:hidden;
  background:linear-gradient(160deg,#2E5A44,#173A2A)}
.hero-img::after{content:"";position:absolute;inset:0;opacity:.14;
  background-image:repeating-radial-gradient(circle at 70% 30%, transparent 0 14px, rgba(255,255,255,.5) 15px 16px, transparent 17px 30px)}
.hero-meta{position:absolute;left:14px;bottom:12px;color:#fff;z-index:2}
.hero-meta b{display:block;font-size:20px;letter-spacing:-.01em}
.hero-meta span{font-size:11px;opacity:.82;font-family:ui-monospace,monospace}
.hero-body{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-width:0}
.hero-body h2{font-size:var(--fs-title);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-body .sub{font-size:12px;color:var(--muted);margin-top:2px}
.price{color:var(--price);font-weight:700;font-size:var(--fs-price);letter-spacing:-.02em;white-space:nowrap;flex:none}
.price i{font-style:normal;font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}

/* minmax(0,1fr)：防止 nowrap 的 price 把网格撑出视口（横向溢出） */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.card{background:var(--surface);border-radius:var(--r-2);overflow:hidden;box-shadow:var(--shadow-1);
  display:flex;flex-direction:column;transition:transform 100ms var(--ease),box-shadow 180ms var(--ease)}
.card:active{transform:scale(.985);box-shadow:var(--shadow-2)}
.card:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.thumb{aspect-ratio:4/3;background:var(--surface-2);position:relative;overflow:hidden}
.thumb img,.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;background:linear-gradient(110deg,var(--surface-2) 30%,#F7FAF8 50%,var(--surface-2) 70%);
  background-size:200% 100%;animation:shimmer 1.5s linear infinite}
/* 无图占位：斜纹 + 中心小标记，避免"死灰块" */
.thumb::after{content:"山";position:absolute;inset:0;display:grid;place-items:center;z-index:2;
  font-size:22px;color:rgba(26,29,26,.16);font-weight:600;
  background-image:repeating-linear-gradient(135deg,rgba(26,29,26,.035) 0 1px,transparent 1px 9px)}
@keyframes shimmer{to{background-position:-200% 0}}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.card-title{font-size:var(--fs-body);font-weight:500;line-height:1.45;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--tag-bg);color:var(--tag-ink)}
.tag.dark{background:rgba(26,29,26,.06);color:var(--ink-2)}
.add{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;flex:none;
  transition:transform 100ms var(--ease),background 150ms}
.add:active{transform:scale(.92)}
.add:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.add[disabled]{opacity:.4;pointer-events:none}

/* 骨架 */
.sk{background:var(--surface);border-radius:var(--r-2);overflow:hidden;box-shadow:var(--shadow-1)}
.sk-line{height:12px;border-radius:4px;background:linear-gradient(110deg,#E6ECE8 30%,#F3F7F4 50%,#E6ECE8 70%);
  background-size:200% 100%;animation:shimmer 1.5s linear infinite}
.sk-img{aspect-ratio:4/3}

/* 空 / 错 */
.state{padding:48px 24px;text-align:center;color:var(--muted)}
.state svg{color:rgba(15,61,42,.35);margin-bottom:12px}
.state b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.state p{font-size:13px;max-width:26ch;margin:0 auto 16px}
.state button{height:40px;padding:0 18px;border-radius:999px;background:var(--brand);color:#fff;
  font-size:14px;font-weight:600;transition:transform 100ms var(--ease)}
.state button:active{transform:scale(.97)}
.state button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* 吸底 + 安全区 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:430px;margin:0 auto;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;font-size:12px;color:var(--muted)}
.bar .sum b{display:block;font-size:15px;color:var(--ink)}
.bar .cart{position:relative;height:44px;padding:0 20px;border-radius:999px;background:var(--brand);
  color:#fff;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;
  transition:transform 100ms var(--ease),background 150ms}
.bar .cart:active{transform:scale(.97)}
.cart-count{min-width:18px;height:18px;border-radius:9px;background:#fff;color:var(--brand);
  font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.cart-count.bump{animation:bump 160ms var(--ease)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

/* 演示用状态切换（非产品 UI，虚线区分） */
.demo{display:flex;gap:4px;padding:6px;margin:16px 0 0;border:1px dashed rgba(26,29,26,.25);
  border-radius:8px;background:rgba(255,255,255,.92);font-size:10px;opacity:.8}
.demo button{padding:3px 6px;border-radius:4px;color:var(--muted)}
.demo button.on{background:var(--ink);color:#fff}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .thumb .ph,.sk-line{animation:none;background:#E9EEEB}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-bar">
    <span class="nav-title">山货铺</span>
    <span class="nav-sub">今日 7 款</span>
  </div>
  <div class="nav-tabs"><span class="on">今日到货</span><span>按季</span><span>我的订单</span></div>
</div>

<div class="search">
  <label class="search-in">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" placeholder="搜山货，如「冬笋」" enterkeyhint="search">
  </label>
</div>

<div class="chips" id="chips">
  <button class="chip on" type="button" data-f="all">全部</button>
  <button class="chip" type="button" data-f="fresh">时令</button>
  <button class="chip" type="button" data-f="dry">干货</button>
  <button class="chip" type="button" data-f="soldout">已售罄</button>
</div>

<main class="list" id="list">
  <!-- 骨架（载入 500ms） -->
  <div id="skeleton" hidden>
    <div class="sk" style="margin-bottom:12px"><div class="sk-img" style="aspect-ratio:16/9;background:#E6ECE8"></div>
      <div style="padding:12px 14px"><div class="sk-line" style="width:60%"></div></div></div>
    <div class="grid">
      <div class="sk"><div class="sk-img"></div><div style="padding:10px 12px"><div class="sk-line" style="width:80%"></div><div class="sk-line" style="width:50%;margin-top:8px"></div></div></div>
      <div class="sk"><div class="sk-img"></div><div style="padding:10px 12px"><div class="sk-line" style="width:70%"></div><div class="sk-line" style="width:40%;margin-top:8px"></div></div></div>
    </div>
  </div>

  <!-- 列表 -->
  <div id="content">
    <!-- 破格首卡：整宽 + 等高线签名 + 经纬度 -->
    <a class="hero-card" href="#" aria-label="临安冬笋，¥38 每斤">
      <div class="hero-img">
        <div class="hero-meta"><b>临安 · 冬笋</b><span>N30.23° E119.72° · 海拔 640m</span></div>
      </div>
      <div class="hero-body">
        <div><h2>今早挖的冬笋</h2><div class="sub">带壳 2 斤装 · 当日发</div></div>
        <div class="price">¥38<i>/斤</i></div>
      </div>
    </a>

    <div class="grid">
      <article class="card">
        <div class="thumb"><div class="ph"></div><img src="" alt="天目山笋干" loading="lazy" onerror="this.style.display='none'"></div>
        <div class="card-body">
          <p class="card-title">天目山笋干 · 炭焙</p>
          <div class="card-meta">
            <span class="tag">干货</span>
            <span class="price" style="font-size:16px">¥68<i>/袋</i></span>
            <button class="add" type="button" aria-label="加入购物车：天目山笋干">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="thumb"><div class="ph"></div><img src="" alt="高山土蜂蜜" loading="lazy" onerror="this.style.display='none'"></div>
        <div class="card-body">
          <p class="card-title">高山土蜂蜜 · 500g</p>
          <div class="card-meta">
            <span class="tag dark">时令</span>
            <span class="price" style="font-size:16px">¥92<i>/瓶</i></span>
            <button class="add" type="button" aria-label="加入购物车：高山土蜂蜜">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="thumb" style="aspect-ratio:1/1"><div class="ph"></div>
          <img src="" alt="野生菌菇" loading="lazy" onerror="this.style.display='none'"></div>
        <div class="card-body">
          <p class="card-title">野生菌菇拼盘</p>
          <div class="card-meta"><span class="tag">时令</span><span class="price" style="font-size:16px">¥56<i>/份</i></span>
            <button class="add" type="button" aria-label="加入购物车：野生菌菇拼盘"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        </div>
      </article>

      <article class="card">
        <div class="thumb" style="aspect-ratio:4/5"><div class="ph"></div>
          <img src="" alt="古法红糖" loading="lazy" onerror="this.style.display='none'"></div>
        <div class="card-body">
          <p class="card-title">古法红糖 · 手工熬制</p>
          <div class="card-meta"><span class="tag dark">干货</span><span class="price" style="font-size:16px">¥45<i>/盒</i></span>
            <button class="add" type="button" aria-label="加入购物车：古法红糖"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        </div>
      </article>
    </div>
  </div>

  <!-- 空态 -->
  <div class="state" id="empty" hidden>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 7h18l-2 12H5z"/><path d="M8 7a4 4 0 118 0"/></svg>
    <b>这一栏今天空了</b>
    <p>已售罄的会在明早 7 点补货。先去看看时令山货？</p>
    <button type="button" id="goFresh">看时令山货</button>
  </div>

  <!-- 错误态 -->
  <div class="state" id="error" hidden>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
    <b>没加载出来</b>
    <p>网络不稳。已选的条件还留着，重试即可。</p>
    <button type="button" id="retry">重试</button>
  </div>
</main>

<div class="bar">
  <div class="sum"><b>今日 7 款 · 4 款已上架</b>满 99 包邮，明早 7 点补货</div>
  <button class="cart" type="button" id="cartBtn">
    购物车 <span class="cart-count" id="count">0</span>
  </button>
</div>

<div class="demo" id="demo">
  <button class="on" data-s="list">列表</button>
  <button data-s="skeleton">骨架</button>
  <button data-s="empty">空态</button>
  <button data-s="error">错误</button>
</div>

<script>
(function(){
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var skeleton = document.getElementById("skeleton");
  var content = document.getElementById("content");
  var empty = document.getElementById("empty");
  var error = document.getElementById("error");
  var count = document.getElementById("count");
  var n = 0;

  function show(which){
    skeleton.hidden = which !== "skeleton";
    content.hidden = which === "empty" || which === "error" || which === "skeleton";
    empty.hidden = which !== "empty";
    error.hidden = which !== "error";
    document.querySelectorAll("#demo button").forEach(function(b){
      b.classList.toggle("on", b.dataset.s === which);
    });
  }

  /* 首屏：骨架 500ms → 列表（尺寸一致，无跳动） */
  content.hidden = true; show("skeleton");
  setTimeout(function(){ show("list"); }, reduced ? 0 : 500);

  document.querySelectorAll("#demo button").forEach(function(b){
    b.addEventListener("click", function(){ show(b.dataset.s); });
  });

  /* 筛选：0 条走空态（真实分支，不是演示） */
  document.querySelectorAll(".chip").forEach(function(chip){
    chip.addEventListener("click", function(){
      document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("on"); });
      chip.classList.add("on");
      if (chip.dataset.f === "soldout") { show("empty"); }
      else { show("list"); }
    });
  });
  document.getElementById("goFresh").addEventListener("click", function(){
    document.querySelector('.chip[data-f="fresh"]').click();
  });
  document.getElementById("retry").addEventListener("click", function(){ show("list"); });

  /* 加购：计数 + 160ms 弹一下（反馈）；按钮 100ms 压下 */
  document.querySelectorAll(".add").forEach(function(btn){
    btn.addEventListener("click", function(){
      n += 1; count.textContent = n;
      if (reduced) return;
      count.classList.remove("bump");
      void count.offsetWidth;
      count.classList.add("bump");
    });
  });
})();
</script>
</body>
</html>
